name: Auto GTA VI Shorts Pipeline

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Upload target (all, yt2_only, yt3_only, or ig_noon_only)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - yt2_only
          - yt3_only
          - ig_noon_only

permissions:
  contents: write

jobs:
  process-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          pip install --no-cache-dir \
            faster-whisper requests \
            google-api-python-client google-auth-oauthlib \
            nudenet google-genai edge-tts pillow
          pip install --no-cache-dir -U "yt-dlp[default]"
          pip install --no-cache-dir --force-reinstall opencv-contrib-python-headless

      - name: Run pipeline
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_2: ${{ secrets.YT_REFRESH_TOKEN_2 }}
          YT_REFRESH_TOKEN_3: ${{ secrets.YT_REFRESH_TOKEN_3 }}
          PYTHONUNBUFFERED: "1"
          UPLOAD_TARGET: ${{ github.event.inputs.target || 'all' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pipeline.py

      - name: Save processed clip IDs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add processed.txt daily_count.txt
          if [ -f mc_schedule.json ]; then git add mc_schedule.json; fi
          git diff --staged --quiet || git commit -m "Update processed clips" && git push
